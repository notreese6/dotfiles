# ============================================================
# ~/.tmux.conf
# Reload:  prefix + r        Install plugins:  prefix + I
# Default prefix is C-b (unchanged).
# ============================================================


# ---- General settings --------------------------------------

# Pin pane shell to bash regardless of $SHELL.
set -g default-shell /bin/bash
set -g default-command /bin/bash

# 256-color + truecolor advertising. Without this, colors inside
# tmux look washed out (vim, bat, lazygit, etc.).
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Effectively unlimited scrollback. Memory is paid only for lines
# actually written.
set -g history-limit 1000000

# Kill the small Esc-key delay so vim doesn't feel laggy in tmux.
set -sg escape-time 0

# Forward focus events so vim's `:set autoread` works on pane switch.
set -g focus-events on

# Number windows/panes from 1 (easier to reach prefix + 1 than + 0)
# and renumber when one is closed (no gaps).
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on


# ---- Keybindings -------------------------------------------

# Reload config in-place.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits (open in current pane's directory). | = vertical, - = horizontal.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation. Default arrow-key bindings still work.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize, repeatable: prefix + H/J/K/L, then keep tapping.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi keys in copy mode + cross-platform clipboard integration via
# scripts/clip.sh (picks pbcopy on macOS, wl-copy / xclip / xsel on Linux).
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.tmux/scripts/clip.sh"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.tmux/scripts/clip.sh"

# Mouse stays OFF, deliberately: the terminal keeps its own drag-select, its own
# scrollbar, and Cmd-C, which is what makes the rest of tmux pleasant to use.
# The consequence is that MouseDragEnd1Pane above is inert until the toggle
# below turns it on, and that the terminal can only ever select what it painted
# — tmux's scrollback is not the terminal's scrollback, so anything scrolled off
# has to come out through copy mode.
#
# prefix + [  to enter copy mode, v to start a selection, y to take it. That is
# the path that reaches the Mac clipboard over SSH, and the one the two fixes
# below exist to keep working.

# Lets a program running INSIDE tmux set the clipboard by emitting OSC 52, with
# tmux forwarding it outward instead of swallowing it. Load-bearing with the
# mouse off: it means copy mode reaches the far clipboard through tmux itself,
# not only through clip.sh's pipe, so the two paths back each other up rather
# than one of them silently being the only one that ever worked.
set -g set-clipboard on

# tmux-yank binds y and MouseDragEnd1Pane too, and it is loaded by `run tpm` at
# the bottom of this file — after the bindings above — so it silently won every
# time and clip.sh had never once run from copy mode. On a Mac that looks fine,
# because yank picks pbcopy. Over SSH it was the whole bug: yank fills whichever
# clipboard it can find on the far end, so on a VM with DISPLAY set it copied
# into that VM's own X clipboard, which nobody is looking at.
#
# Pointing yank at clip.sh fixes it without giving the plugin up: every key it
# owns — prefix+y (current command line), prefix+Y (pane's working directory),
# ! (copy without the trailing newline), M-y — keeps working, and all of them
# now route through the one script that knows to prefer OSC 52 over a local
# clipboard nobody can see. The explicit bindings above stay as the fallback for
# a machine whose plugins are not installed yet.
set -g @override_copy_command '~/.tmux/scripts/clip.sh'

# prefix + m turns the mouse on for as long as it is useful — a long scrollback
# hunt, or dragging a selection straight to the clipboard via the binding above.
# Reports the new state, because a toggle whose effect is invisible gets pressed
# twice and lands back where it started.
bind m set -g mouse \; display "mouse #{?mouse,on,off}"

# prefix + D — prompts for a name, then builds a dev workspace
# (3 terminals + editor + runner) via dev-layout.sh.
# Inside tmux: creates a new window. Outside: a new session.
bind D command-prompt -p "name:" -I "dev" \
  "run-shell '~/.tmux/scripts/dev-layout.sh \"%%\" \"#{pane_current_path}\"'"


# ---- Pane border titles ------------------------------------
# Slim labeled bar at the top of every pane. dev-layout.sh sets
# meaningful titles; manual panes default to the running command.
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=green bold],#[fg=white]}#{pane_index}: #{pane_title} "


# ---- Plugins (TPM) -----------------------------------------
# After editing this list:  prefix + I (install) / U (update) /
# alt+u (uninstall removed).

set -g @plugin 'tmux-plugins/tpm'                # plugin manager itself
set -g @plugin 'tmux-plugins/tmux-sensible'      # universal sane defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'     # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-yank'          # system clipboard from copy mode
set -g @plugin 'christoomey/vim-tmux-navigator'  # Ctrl-h/j/k/l across vim+tmux
set -g @plugin 'dracula/tmux'                    # status bar theme

# LAST, and it has to stay last. tmux-continuum has no timer of its own — it
# appends #(continuum_save.sh) to status-right and relies on tmux re-evaluating
# that line on an interval, so the status bar IS the scheduler. Any plugin that
# loads after it and assigns status-right silently removes the only thing that
# ever triggers a save.
#
# That is not hypothetical: dracula does `set -g status-right ""` while building
# its bar, and with continuum ahead of it in this list the saves stopped dead on
# 2026-06-08. Nothing reported it. Every restore for the two months after that
# replayed the June snapshot, which reads as "restore is flaky" rather than
# "nothing has been saved since June".
set -g @plugin 'tmux-plugins/tmux-continuum'     # auto-save + auto-restore

# ---- Resurrect / Continuum ---------------------------------

set -g @continuum-restore 'on'                # auto-restore on tmux start
set -g @continuum-save-interval '15'          # save snapshot every 15 min

# Full scrollback, not just the visible screen. `visible` would cut each save to
# a few KB but throws away the scrollback, which is the part worth restoring.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'      # restore vim :mksession files


# ---- Dracula theme -----------------------------------------
# Right-side widgets, in order. Other options: battery, weather,
# network, attached-clients, kubernetes-context, spotify-tui, …
set -g @dracula-plugins "git cpu-usage ram-usage time"
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-show-flags true               # *, -, ! window flags
set -g @dracula-refresh-rate 5
set -g @dracula-day-month true                # DD/MM date format
set -g @dracula-military-time true            # 24-hour clock
set -g @dracula-border-contrast true          # brighten inactive borders


# ============================================================
# Initialize TPM — MUST be the very last line.
# ============================================================
run '~/.tmux/plugins/tpm/tpm'
